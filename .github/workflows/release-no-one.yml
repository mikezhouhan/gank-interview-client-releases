name: NO ONE Build and Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v0.0.1'
      branch:
        description: 'Branch to checkout from private repository (e.g., dev, main)'
        required: true
        default: 'dev'
      full_validation:
        description: 'Run full regression (use after Electron, protection or core behaviour changes)'
        type: boolean
        required: false
        default: false
  push:
    tags:
      - v*.*.*

permissions:
  contents: write

jobs:
  release:
    timeout-minutes: 360
    runs-on: ${{ matrix.os }}
    environment: default
    strategy:
      matrix:
        include:
          - os: macos-15-intel  # Intel x64 runner on macOS 15
            platform: mac-x64
          - os: macos-latest    # ARM64 runner for arm64 build
            platform: mac-arm64
          - os: windows-2022
            platform: windows
      fail-fast: false

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          repository: mikezhouhan/Gank-Interview
          token: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref }}
          persist-credentials: true
          clean: true
          sparse-checkout-cone-mode: true
          fetch-depth: 1
          fetch-tags: true
          show-progress: true
          lfs: false
          submodules: false
          set-safe-directory: true

      - name: Print Cloned Commit ID
        shell: bash
        run: |
          echo "Cloned commit ID from private repository (mikezhouhan/Gank-Interview):"
          git rev-parse HEAD

      - name: Get release tag
        id: get-tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 23

      - name: Get npm cache directory path
        id: npm-cache-dir-path
        run: echo "dir=$(npm config get cache)" >> $GITHUB_OUTPUT

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.npm-cache-dir-path.outputs.dir }}
            node_modules
          key: ${{ runner.os }}-${{ matrix.platform }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.platform }}-npm-

      - name: Install Dependencies
        run: npm install --legacy-peer-deps # Added --legacy-peer-deps based on common Electron/Vite project needs, remove if not necessary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Identify Rust cache compiler
        id: rust-compiler
        run: node scripts/rust-dependency-cache.cjs key

      - name: Restore public Rust dependencies
        id: rust-cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/cache/index.crates.io-*
            ~/.cargo/registry/index/index.crates.io-*
            native/gank-core/target
          key: rust-public-v1-${{ matrix.platform }}-${{ steps.rust-compiler.outputs.compiler }}-${{ hashFiles('native/gank-core/Cargo.lock', 'native/gank-core/Cargo.toml', 'native/gank-core-macros/Cargo.toml', 'native/vendor/napi-2.16.17/Cargo.toml', 'scripts/build-rust-core.cjs', 'scripts/rust-dependency-cache.cjs') }}
          restore-keys: |
            rust-public-v1-${{ matrix.platform }}-${{ steps.rust-compiler.outputs.compiler }}-

      - name: Replace package.json values for stealth build
        shell: bash
        run: |
          # Use Node.js to modify package.json
          node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.name = 'Desktophelper';
          // Replace productName
          pkg.build.productName = 'Desktophelper';

          // Replace Mac icon
          pkg.build.mac.icon = 'assets/icons/mac/blank.icns';

          // Replace Windows icon
          pkg.build.win.icon = 'assets/icons/win/blank.ico';

          // Write the modified package.json
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          console.log('✅ package.json modified for stealth build');
          "

      - name: Configure Mac build architecture
        if: matrix.platform == 'mac-x64' || matrix.platform == 'mac-arm64'
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "mac-x64" ]; then
            echo "Configuring build for x64 only..."
            node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));p.build.mac.target=[{target:'dmg',arch:['x64']},{target:'zip',arch:['x64']}];fs.writeFileSync('package.json',JSON.stringify(p,null,2));"
          else
            echo "Configuring build for arm64 only..."
            node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));p.build.mac.target=[{target:'dmg',arch:['arm64']},{target:'zip',arch:['arm64']}];fs.writeFileSync('package.json',JSON.stringify(p,null,2));"
          fi

      - name: Build Mac
        if: matrix.platform == 'mac-x64' || matrix.platform == 'mac-arm64'
        run: npm run package-mac -- --publish=never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          GANK_UPDATE_SIGNING_KEY: ${{ secrets.GANK_UPDATE_SIGNING_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify main-process keyboard tap module
        if: matrix.platform == 'mac-x64' || matrix.platform == 'mac-arm64'
        shell: bash
        run: |
          APP_PATH=$(find release -type d -name '*.app' -print -quit)
          test -n "$APP_PATH"
          TAP_MODULE="$APP_PATH/Contents/Frameworks/macos_keyboard_tap.node"
          test -f "$TAP_MODULE"
          codesign -dv --verbose=4 "$TAP_MODULE"
          codesign --verify --strict --verbose=4 "$TAP_MODULE"
          codesign --verify --deep --strict --verbose=4 "$APP_PATH"

      - name: Submit app for notarization
        id: notarization
        if: matrix.platform == 'mac-x64' || matrix.platform == 'mac-arm64'
        timeout-minutes: 16
        run: node scripts/notarize-release.cjs submit ${{ matrix.platform }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build Windows
        if: matrix.platform == 'windows'
        run: npm run package-win -- --publish=never
        env:
          GANK_UPDATE_SIGNING_KEY: ${{ secrets.GANK_UPDATE_SIGNING_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke test packaged modules (offline)
        timeout-minutes: 10
        run: node scripts/test-built-package.cjs
        env:
          GANK_PACKAGE_CHECKS: ${{ github.event.inputs.full_validation == 'true' && 'full' || 'smoke' }}

      # Cache only after the packaged checks pass. Cleanup is fail-closed: an
      # unavailable/unclean cache may be skipped, but can never upload private artifacts.
      - name: Prepare public Rust dependency cache
        id: rust-cache-ready
        if: steps.rust-cache.outputs.cache-primary-key != '' && steps.rust-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: node scripts/rust-dependency-cache.cjs clean

      - name: Save public Rust dependencies
        if: steps.rust-cache.outputs.cache-primary-key != '' && steps.rust-cache.outputs.cache-hit != 'true' && steps.rust-cache-ready.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/cache/index.crates.io-*
            ~/.cargo/registry/index/index.crates.io-*
            native/gank-core/target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}

      # Apple processes the submission while the offline packaged checks run.
      # Publishing below requires both the tests and an Accepted verdict.
      - name: Wait for notarization acceptance
        if: matrix.platform == 'mac-x64' || matrix.platform == 'mac-arm64'
        timeout-minutes: 92
        run: node scripts/notarize-release.cjs wait
        env:
          NOTARIZATION_ID: ${{ steps.notarization.outputs.submission_id }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Release Mac
        if: matrix.platform == 'mac-x64' || matrix.platform == 'mac-arm64'
        uses: ncipollo/release-action@v1
        with:
          draft: true
          allowUpdates: true
          artifactErrorsFailBuild: true
          makeLatest: false
          tag: ${{ steps.get-tag.outputs.tag }}
          artifacts: 'release/*.dmg,release/*.zip,release/*.dmg.update.yml,release/*.zip.update.yml'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Windows
        if: matrix.platform == 'windows'
        uses: ncipollo/release-action@v1
        with:
          draft: true
          allowUpdates: true
          artifactErrorsFailBuild: true
          makeLatest: false
          tag: ${{ steps.get-tag.outputs.tag }}
          artifacts: 'release/*.exe,release/latest.yml'
          token: ${{ secrets.GITHUB_TOKEN }}

  merge-mac-latest:
    needs: release
    environment: default
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Check out update verification tools
        uses: actions/checkout@v4
        with:
          repository: mikezhouhan/Gank-Interview
          token: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/merge-signed-mac-update.cjs
            /scripts/update-artifact-signing.cjs
            /build/update-trust.json

      - name: Download mac release assets
        run: |
          mkdir -p release-assets
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*-arm64.zip' \
            --pattern '*-x64.zip' \
            --pattern '*-arm64.dmg' \
            --pattern '*-x64.dmg' \
            --pattern '*.zip.update.yml' \
            --pattern '*.dmg.update.yml' \
            --dir release-assets \
            --clobber

      - name: Generate merged latest-mac.yml
        run: node scripts/merge-signed-mac-update.cjs release-assets Desktophelper "${TAG#v}"

      - name: Upload merged latest-mac.yml
        run: gh release upload "$TAG" release-assets/latest-mac.yml --repo "$GITHUB_REPOSITORY" --clobber
