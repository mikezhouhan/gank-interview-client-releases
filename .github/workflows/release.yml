name: Build and Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v0.0.1'
      branch:
        description: 'Branch to checkout from private repository (e.g., dev, main)'
        required: true
        default: 'dev'
      windows_runtime_check:
        description: '仅验收 Windows 定制运行时，不发布安装包'
        type: boolean
        default: false
  push:
    tags:
      - v*.*.*

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.os }}
    environment: default
    strategy:
      matrix:
        include: ${{ fromJSON(inputs.windows_runtime_check && '[{"os":"windows-2022","platform":"windows"}]' || '[{"os":"macos-15-intel","platform":"mac-x64"},{"os":"macos-latest","platform":"mac-arm64"},{"os":"windows-2022","platform":"windows"}]') }}
      fail-fast: false

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          repository: mikezhouhan/Gank-Interview
          token: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref }}
          persist-credentials: true
          clean: true
          sparse-checkout-cone-mode: true
          fetch-depth: 1
          fetch-tags: true
          show-progress: true
          lfs: false
          submodules: false
          set-safe-directory: true

      - name: Print Cloned Commit ID
        shell: bash
        run: |
          echo "Cloned commit ID from private repository (mikezhouhan/Gank-Interview):"
          git rev-parse HEAD

      - name: Get release tag
        id: get-tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 23

      - name: Get npm cache directory path
        id: npm-cache-dir-path
        run: echo "dir=$(npm config get cache)" >> $GITHUB_OUTPUT

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.npm-cache-dir-path.outputs.dir }}
            node_modules
          key: ${{ runner.os }}-${{ matrix.platform }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.platform }}-npm-

      - name: Install Dependencies
        run: npm install --legacy-peer-deps # Added --legacy-peer-deps based on common Electron/Vite project needs, remove if not necessary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Removed Build Linux step

      - name: Install Python for pinned Windows runtime tools
        if: inputs.windows_runtime_check
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build and verify Windows runtime candidate
        if: inputs.windows_runtime_check
        timeout-minutes: 330
        shell: pwsh
        run: |
          # Use the volume with most free space; do not delete runner software.
          $drive = Get-PSDrive -PSProvider FileSystem | Where-Object { $_.Name -in @('C', 'D') } | Sort-Object Free -Descending | Select-Object -First 1
          $root = Join-Path $drive.Root "gank-runtime-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          ./runtime/electron-29.4.6/verify-windows-runtime.ps1 -BuildRoot $root
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Save Windows runtime verification evidence
        if: always() && inputs.windows_runtime_check
        uses: actions/upload-artifact@v4
        with:
          name: windows-runtime-integrity-evidence
          path: |
            ${{ runner.temp }}/gank-runtime-host-report.json
            ${{ runner.temp }}/gank-runtime-build-report.json
            ${{ runner.temp }}/gank-windows-runtime-smoke-report.json
          if-no-files-found: warn

      - name: Configure Mac build architecture
        if: matrix.platform == 'mac-x64' || matrix.platform == 'mac-arm64'
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "mac-x64" ]; then
            echo "Configuring build for x64 only..."
            node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));p.build.mac.target=[{target:'dmg',arch:['x64']},{target:'zip',arch:['x64']}];fs.writeFileSync('package.json',JSON.stringify(p,null,2));"
          else
            echo "Configuring build for arm64 only..."
            node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));p.build.mac.target=[{target:'dmg',arch:['arm64']},{target:'zip',arch:['arm64']}];fs.writeFileSync('package.json',JSON.stringify(p,null,2));"
          fi

      - name: Build Mac
        if: matrix.platform == 'mac-x64' || matrix.platform == 'mac-arm64'
        run: npm run package-mac -- --publish=never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          GANK_UPDATE_SIGNING_KEY: ${{ secrets.GANK_UPDATE_SIGNING_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify main-process keyboard tap module
        if: matrix.platform == 'mac-x64' || matrix.platform == 'mac-arm64'
        shell: bash
        run: |
          APP_PATH=$(find release -type d -name '*.app' -print -quit)
          test -n "$APP_PATH"
          TAP_MODULE="$APP_PATH/Contents/Frameworks/macos_keyboard_tap.node"
          test -f "$TAP_MODULE"
          codesign -dv --verbose=4 "$TAP_MODULE"
          codesign --verify --strict --verbose=4 "$TAP_MODULE"
          codesign --verify --deep --strict --verbose=4 "$APP_PATH"

      - name: Submit app for notarization
        if: matrix.platform == 'mac-x64' || matrix.platform == 'mac-arm64'
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "mac-x64" ]; then
            DMG_FILE="release/GankInterview-*-x64.dmg"
          else
            DMG_FILE="release/GankInterview-*-arm64.dmg"
          fi
          SUBMISSION_OUTPUT=$(xcrun notarytool submit --force $DMG_FILE --apple-id "${{ secrets.APPLE_ID }}" --password "${{ secrets.APPLE_PASSWORD }}" --team-id "${{ secrets.APPLE_TEAM_ID }}")
          echo "$SUBMISSION_OUTPUT"
          SUBMISSION_ID=$(echo "$SUBMISSION_OUTPUT" | grep "id:" | head -1 | awk '{print $2}')
          echo "SUBMISSION_ID=$SUBMISSION_ID" >> $GITHUB_ENV

      - name: Check notarization status
        if: matrix.platform == 'mac-x64' || matrix.platform == 'mac-arm64'
        shell: bash
        run: |
          MAX_ATTEMPTS=10
          ATTEMPT=1
          for i in $(seq 1 $MAX_ATTEMPTS); do
            STATUS_OUTPUT=$(xcrun notarytool info $SUBMISSION_ID --apple-id "${{ secrets.APPLE_ID }}" --password "${{ secrets.APPLE_PASSWORD }}" --team-id "${{ secrets.APPLE_TEAM_ID }}")
            echo "$STATUS_OUTPUT"
            STATUS=$(echo "$STATUS_OUTPUT" | grep "status:" | sed 's/status: //' | xargs)
            if [ "$STATUS" = "Accepted" ]; then
              echo "Notarization succeeded for ${{ matrix.platform }}!"
              break
            elif [ "$STATUS" = "In Progress" ]; then
              echo "Notarization in progress, retrying in 600 seconds..."
              sleep 600
              ATTEMPT=$((ATTEMPT + 1))
            else
              echo "Notarization failed with status: $STATUS"
              exit 1
            fi
            if [ $ATTEMPT -eq $MAX_ATTEMPTS ]; then
              echo "Max attempts reached, notarization still in progress."
              exit 1
            fi
          done

      - name: Build Windows
        if: matrix.platform == 'windows' && !inputs.windows_runtime_check
        run: npm run package-win -- --publish=never
        env:
          GANK_UPDATE_SIGNING_KEY: ${{ secrets.GANK_UPDATE_SIGNING_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke test packaged modules (offline)
        if: ${{ !inputs.windows_runtime_check }}
        timeout-minutes: 10
        run: node scripts/test-built-package.cjs

      - name: Release Mac
        if: matrix.platform == 'mac-x64' || matrix.platform == 'mac-arm64'
        uses: ncipollo/release-action@v1
        with:
          draft: true
          allowUpdates: true
          artifactErrorsFailBuild: true
          makeLatest: false
          tag: ${{ steps.get-tag.outputs.tag }}
          artifacts: 'release/*.dmg,release/*.zip,release/*.dmg.update.yml,release/*.zip.update.yml'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Windows
        if: matrix.platform == 'windows' && !inputs.windows_runtime_check
        uses: ncipollo/release-action@v1
        with:
          draft: true
          allowUpdates: true
          artifactErrorsFailBuild: true
          makeLatest: false
          tag: ${{ steps.get-tag.outputs.tag }}
          artifacts: 'release/*.exe,release/latest.yml'
          token: ${{ secrets.GITHUB_TOKEN }}

  merge-mac-latest:
    if: ${{ !inputs.windows_runtime_check }}
    needs: release
    environment: default
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Check out update verification tools
        uses: actions/checkout@v4
        with:
          repository: mikezhouhan/Gank-Interview
          token: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/merge-signed-mac-update.cjs
            /scripts/update-artifact-signing.cjs
            /build/update-trust.json

      - name: Download mac release assets
        run: |
          mkdir -p release-assets
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*-arm64.zip' \
            --pattern '*-x64.zip' \
            --pattern '*-arm64.dmg' \
            --pattern '*-x64.dmg' \
            --pattern '*.zip.update.yml' \
            --pattern '*.dmg.update.yml' \
            --dir release-assets \
            --clobber

      - name: Generate merged latest-mac.yml
        run: node scripts/merge-signed-mac-update.cjs release-assets GankInterview "${TAG#v}"

      - name: Upload merged latest-mac.yml
        run: gh release upload "$TAG" release-assets/latest-mac.yml --repo "$GITHUB_REPOSITORY" --clobber
