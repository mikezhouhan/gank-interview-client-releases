name: NO ONE Build and Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v0.0.1'
      branch:
        description: 'Branch to checkout from private repository (e.g., dev, main)'
        required: true
        default: 'dev'
        
  push:
    tags:
      - v*.*.*

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    environment: default
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      tag: ${{ steps.source.outputs.tag }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - name: Resolve release source
        uses: actions/checkout@v4
        with:
          repository: mikezhouhan/Gank-Interview
          token: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 23
      - name: Validate tag and freeze source commit
        id: source
        run: node scripts/release-preflight.cjs --write-outputs
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          RELEASE_PRODUCT: Desktophelper

  release:
    needs: prepare
    runs-on: ${{ matrix.os }}
    environment: default
    strategy:
      matrix:
        include:
          - os: macos-15-intel  # Intel x64 runner on macOS 15
            platform: mac-x64
          - os: macos-latest    # ARM64 runner for arm64 build
            platform: mac-arm64
          - os: windows-2022
            platform: windows
      fail-fast: false

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          repository: mikezhouhan/Gank-Interview
          token: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
          clean: true
          sparse-checkout-cone-mode: true
          fetch-depth: 1
          fetch-tags: true
          show-progress: true
          lfs: false
          submodules: false
          set-safe-directory: true

      - name: Print Cloned Commit ID
        shell: bash
        run: |
          echo "Cloned commit ID from private repository (mikezhouhan/Gank-Interview):"
          git rev-parse HEAD

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 23

      - name: Verify release signing key
        run: node scripts/release-preflight.cjs --check-signing-key
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_PRODUCT: Desktophelper
          GANK_UPDATE_SIGNING_KEY: ${{ secrets.GANK_UPDATE_SIGNING_KEY }}

      - name: Get npm cache directory path
        id: npm-cache-dir-path
        run: echo "dir=$(npm config get cache)" >> $GITHUB_OUTPUT

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.npm-cache-dir-path.outputs.dir }}
            node_modules
          key: ${{ runner.os }}-${{ matrix.platform }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.platform }}-npm-

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Replace package.json values for stealth build
        shell: bash
        run: |
          # Use Node.js to modify package.json
          node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.name = 'Desktophelper';
          // Replace productName
          pkg.build.productName = 'Desktophelper';

          // Replace Mac icon
          pkg.build.mac.icon = 'assets/icons/mac/blank.icns';

          // Replace Windows icon
          pkg.build.win.icon = 'assets/icons/win/blank.ico';

          // Write the modified package.json
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          console.log('✅ package.json modified for stealth build');
          "

      - name: Configure Mac build architecture
        if: matrix.platform == 'mac-x64' || matrix.platform == 'mac-arm64'
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "mac-x64" ]; then
            echo "Configuring build for x64 only..."
            node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));p.build.mac.target=[{target:'dmg',arch:['x64']},{target:'zip',arch:['x64']}];fs.writeFileSync('package.json',JSON.stringify(p,null,2));"
          else
            echo "Configuring build for arm64 only..."
            node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));p.build.mac.target=[{target:'dmg',arch:['arm64']},{target:'zip',arch:['arm64']}];fs.writeFileSync('package.json',JSON.stringify(p,null,2));"
          fi

      - name: Build Mac
        if: matrix.platform == 'mac-x64' || matrix.platform == 'mac-arm64'
        run: npm run package-mac -- --publish=never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          GANK_UPDATE_SIGNING_KEY: ${{ secrets.GANK_UPDATE_SIGNING_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify main-process keyboard tap module
        if: matrix.platform == 'mac-x64' || matrix.platform == 'mac-arm64'
        shell: bash
        run: |
          APP_PATH=$(find release -type d -name '*.app' -print -quit)
          test -n "$APP_PATH"
          TAP_MODULE="$APP_PATH/Contents/Frameworks/macos_keyboard_tap.node"
          test -f "$TAP_MODULE"
          codesign -dv --verbose=4 "$TAP_MODULE"
          codesign --verify --strict --verbose=4 "$TAP_MODULE"
          codesign --verify --deep --strict --verbose=4 "$APP_PATH"

      - name: Submit app for notarization
        if: matrix.platform == 'mac-x64' || matrix.platform == 'mac-arm64'
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "mac-x64" ]; then
            DMG_FILE="release/Desktophelper-*-x64.dmg"
          else
            DMG_FILE="release/Desktophelper-*-arm64.dmg"
          fi
          SUBMISSION_OUTPUT=$(xcrun notarytool submit --force $DMG_FILE --apple-id "${{ secrets.APPLE_ID }}" --password "${{ secrets.APPLE_PASSWORD }}" --team-id "${{ secrets.APPLE_TEAM_ID }}")
          echo "$SUBMISSION_OUTPUT"
          SUBMISSION_ID=$(echo "$SUBMISSION_OUTPUT" | grep "id:" | head -1 | awk '{print $2}')
          echo "SUBMISSION_ID=$SUBMISSION_ID" >> $GITHUB_ENV

      - name: Check notarization status
        if: matrix.platform == 'mac-x64' || matrix.platform == 'mac-arm64'
        shell: bash
        run: |
          MAX_ATTEMPTS=10
          ATTEMPT=1
          for i in $(seq 1 $MAX_ATTEMPTS); do
            STATUS_OUTPUT=$(xcrun notarytool info $SUBMISSION_ID --apple-id "${{ secrets.APPLE_ID }}" --password "${{ secrets.APPLE_PASSWORD }}" --team-id "${{ secrets.APPLE_TEAM_ID }}")
            echo "$STATUS_OUTPUT"
            STATUS=$(echo "$STATUS_OUTPUT" | grep "status:" | sed 's/status: //' | xargs)
            if [ "$STATUS" = "Accepted" ]; then
              echo "Notarization succeeded for ${{ matrix.platform }}!"
              break
            elif [ "$STATUS" = "In Progress" ]; then
              echo "Notarization in progress, retrying in 600 seconds..."
              sleep 600
              ATTEMPT=$((ATTEMPT + 1))
            else
              echo "Notarization failed with status: $STATUS"
              exit 1
            fi
            if [ $ATTEMPT -eq $MAX_ATTEMPTS ]; then
              echo "Max attempts reached, notarization still in progress."
              exit 1
            fi
          done

      - name: Build Windows
        if: matrix.platform == 'windows'
        run: npm run package-win -- --publish=never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GANK_UPDATE_SIGNING_KEY: ${{ secrets.GANK_UPDATE_SIGNING_KEY }}

      - name: Release Mac
        if: matrix.platform == 'mac-x64' || matrix.platform == 'mac-arm64'
        uses: ncipollo/release-action@v1
        with:
          draft: true
          allowUpdates: true
          makeLatest: false
          tag: ${{ needs.prepare.outputs.tag }}
          artifacts: 'release/*.dmg,release/*.zip,release/*.dmg.update.yml,release/*.zip.update.yml'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Windows
        if: matrix.platform == 'windows'
        uses: ncipollo/release-action@v1
        with:
          draft: true
          allowUpdates: true
          makeLatest: false
          tag: ${{ needs.prepare.outputs.tag }}
          artifacts: 'release/*.exe,release/latest.yml,release/*.exe.update.yml'
          token: ${{ secrets.GITHUB_TOKEN }}

  merge-mac-latest:
    needs: [prepare, release]
    runs-on: ubuntu-latest
    environment: default
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Check out trusted update verifier
        uses: actions/checkout@v4
        with:
          repository: mikezhouhan/Gank-Interview
          token: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false

      - name: Set up verifier runtime
        uses: actions/setup-node@v4
        with:
          node-version: 23

      - name: Download mac release assets
        run: |
          mkdir -p release-assets
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*-arm64.zip' \
            --pattern '*-x64.zip' \
            --pattern '*-arm64.dmg' \
            --pattern '*-x64.dmg' \
            --pattern '*.zip.update.yml' \
            --pattern '*.dmg.update.yml' \
            --dir release-assets \
            --clobber

      - name: Verify signed artifacts and merge latest-mac.yml
        run: node scripts/merge-signed-mac-update.cjs release-assets Desktophelper "${TAG#v}"

      - name: Upload merged latest-mac.yml
        run: gh release upload "$TAG" release-assets/latest-mac.yml --repo "$GITHUB_REPOSITORY" --clobber
